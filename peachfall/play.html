<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./favicon.svg" />
    <title>Anewgam: The Peachfall</title>
    <meta name="version" content="2.0.0" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anewgam: The Peachfall" />
    <meta name="twitter:image" content="https://stevoblevo.github.io/peachfall/og.jpg" />
    <meta property="og:title" content="Anewgam: The Peachfall" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stevoblevo.github.io/peachfall/play.html" />
    <meta property="og:image" content="https://stevoblevo.github.io/peachfall/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:description" content="A playable slice of Anewgam in a painted peach orchard: Princess Sae steps down from her tower into the light, and Knight Steven meets the little pieces of her one by one." />
    <meta name="description" content="A playable slice of Anewgam in a painted peach orchard: Princess Sae steps down from her tower into the light, and Knight Steven meets the little pieces of her one by one." />
    <meta property="x:creator" content="@Stevoblevo" />
    <script type="module" crossorigin src="./assets/index-gSBOQ3dg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cgkgal7Y.css">
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="1280" height="720" aria-label="The Peachfall"></canvas>
      <div id="overlay" class="overlay">
        <header class="topbar">
          <div class="brand">
            <p class="eyebrow">ANEWGAM</p>
            <h1>The Peachfall</h1>
          </div>
          <div class="controls">
            <button type="button" id="btn-mute" aria-pressed="false">Mute</button>
            <label class="vol">
              Volume
              <input id="volume" type="range" min="0" max="1" step="0.05" value="0.55" />
            </label>
            <button type="button" id="btn-motion">Motion</button>
            <button type="button" id="btn-reset">Reset save</button>
          </div>
        </header>
        <div id="title-lockup" class="title-lockup" hidden>
          <p class="title-eyebrow">ANEWGAM</p>
          <h2 class="title-name">The Peachfall</h2>
        </div>
        <div id="met-count" class="met-count" hidden>Met 0/5</div>
        <div id="hud" class="hud" hidden></div>
        <button type="button" id="back-to-title" class="back-to-title" hidden>Back to title</button>
        <div id="caption" class="caption" role="status" aria-live="polite"></div>
        <div id="dialogue" class="dialogue" hidden></div>
        <div id="labels" class="labels"></div>
        <div id="title-doors" class="doors">
          <button type="button" id="play-dream" data-testid="play-dream">PLAY THE DREAM</button>
          <button type="button" id="watch-dream" data-testid="watch-dream">WATCH THE DREAM</button>
          <button type="button" id="open-gallery" class="ghost">Gallery</button>
        </div>
        <div id="touch-pad" class="touch-pad" hidden>
          <button type="button" data-dir="left" aria-label="Move left">◀</button>
          <button type="button" data-dir="down" aria-label="Move down">▼</button>
          <button type="button" data-dir="up" aria-label="Move up">▲</button>
          <button type="button" data-dir="right" aria-label="Move right">▶</button>
          <button type="button" id="touch-act" data-act="action" title="Meet (Space / Enter)">Meet</button>
          <button type="button" id="touch-bow" data-act="bow" aria-pressed="false" title="bow (hold B, or tap to toggle)">bow</button>
          <button type="button" id="touch-heart" data-act="heart" aria-pressed="false" title="heart-light (hold H, or tap to toggle)">heart-light</button>
        </div>
        <div id="notes" class="notes" hidden>
          <button type="button" id="note-listen" data-listen="1">Listen</button>
          <button type="button" data-note="0" aria-label="Low note">Low</button>
          <button type="button" data-note="1" aria-label="Mid note">Mid</button>
          <button type="button" data-note="2" aria-label="High note">High</button>
        </div>
        <button type="button" id="touch-advance" data-testid="touch-advance" hidden>Advance</button>
        <p id="hint" class="hint"></p>
        <p id="orient-hint" class="orient-hint">Turn your phone on its side for a larger scene.</p>
        <div id="pause-menu" class="pause-menu" hidden>
          <div class="pause-card" role="dialog" aria-modal="true" aria-labelledby="pause-title">
            <h2 id="pause-title">Paused</h2>
            <button type="button" id="pause-resume">Resume</button>
            <button type="button" id="pause-settings">Settings</button>
            <button type="button" id="pause-quit">Quit</button>
            <div id="pause-settings-panel" class="pause-settings" hidden>
              <label class="vol">
                Volume
                <input id="pause-volume" type="range" min="0" max="1" step="0.05" value="0.55" />
              </label>
              <label class="chk">
                <input id="pause-motion" type="checkbox" />
                Reduced motion
              </label>
              <label class="vol">
                Text size
                <input id="pause-text" type="range" min="0.85" max="1.35" step="0.05" value="1" />
              </label>
            </div>
          </div>
        </div>
        <div id="reset-confirm" class="reset-confirm" hidden>
          <div class="pause-card" role="dialog" aria-modal="true" aria-labelledby="reset-title">
            <h2 id="reset-title">Reset save?</h2>
            <p>This starts the dream over from the title. Progress on this machine will be cleared.</p>
            <button type="button" id="reset-confirm-no">Cancel</button>
            <button type="button" id="reset-confirm-yes">Reset save</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./sae-wink/sae-wink.js"></script>
    <script type="module">
      import { mountSaeWink } from "./sae-wink/mount.js";
      mountSaeWink({ world: "peachfall", saveKey: "peachfall-playable-v1", bottom: "96px" });
    </script>
</body>
</html>
