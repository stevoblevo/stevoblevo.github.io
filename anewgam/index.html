<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#140e10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="porch fight" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>porch fight</title>
  <style>
    html, body { margin: 0; height: 100%; background: #140e10; color: #fff8f2; font-family: Georgia, serif; }
    body { position: relative; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .line { position: absolute; left: 8%; right: 8%; bottom: 8%; margin: 0; font-size: 26px; line-height: 1.3; text-shadow: 0 2px 14px rgb(0 0 0 / 0.7); pointer-events: none; }
    .back { position: absolute; top: 14px; left: 18px; z-index: 3; color: #fff8f2; text-decoration: none; font-size: 18px; text-shadow: 0 1px 8px rgb(0 0 0 / 0.7); }
  </style>
</head>
<body id="porchfight">
  <canvas></canvas>
  <a class="back" id="back" href="/">back</a>
  <p class="line" id="line">Hold her eyes.</p>
  <script>
    document.getElementById("back").addEventListener("click", (event) => {
      if (history.length > 1) {
        event.preventDefault();
        history.back();
      }
    });
  </script>
  <script src="fight.js"></script>
</body>
</html>
