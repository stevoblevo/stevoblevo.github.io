services:
  topi-berry:
    build: .
    container_name: topi-berry
    restart: unless-stopped
    ports:
      - "192.168.88.251:8792:80"
      - "127.0.0.1:8792:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
