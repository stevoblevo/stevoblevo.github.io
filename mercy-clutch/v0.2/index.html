<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mercy Clutch · Slipwake Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#071923;color:#e8f4e9;font:16px/1.4 system-ui;display:grid;place-items:center}main{width:min(100%,52rem);padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}header{display:flex;gap:12px;align-items:end;justify-content:space-between}h1{font:clamp(1.8rem,6vw,3.4rem)/1 Georgia;margin:0}.tag{color:#8bceb9;letter-spacing:.09em;font-size:.72rem;text-transform:uppercase}canvas{width:100%;height:clamp(150px,42dvh,400px);display:block;background:#102c36;border:1px solid #37615f;border-radius:16px;margin:10px 0}#coach{min-height:3.25rem;padding:8px 12px;background:#15343c;border-left:4px solid #a7e1b4}#coach strong{display:block;color:#c6f4b8}.drive{display:grid;grid-template-columns:1fr 1.45fr;gap:8px;margin-top:8px}button{font:inherit;font-weight:730;padding:11px 9px;color:#e8f4e9;background:#23464e;border-radius:10px;border:1px solid #78aaa1;min-height:44px;touch-action:none}button[aria-pressed=true]{background:#c6f4b8;color:#172b29}button:focus-visible{outline:3px solid #f4c377;outline-offset:2px}.tools{display:flex;gap:8px;margin-top:7px}.tools button{padding:5px 8px;font-size:.8rem}.stats{font-variant-numeric:tabular-nums;font-size:.8rem;text-align:right}small{display:block;color:#a8c1bc;margin-top:6px}.kbd{white-space:nowrap}@media(max-height:520px) and (orientation:landscape){main{padding-block:5px;display:grid;grid-template-columns:1.4fr 1fr;column-gap:10px;align-items:center}header{grid-column:1/-1}canvas{grid-row:2/6;height:58dvh;margin:3px 0}small{grid-column:2}#coach{min-height:2.5rem}h1{font-size:1.6rem}}

body{background:radial-gradient(ellipse at 50% 0%,#21434a,#071923 65%);color:#f4ecd9}main{width:min(100%,62rem)}h1{letter-spacing:-.045em}canvas{height:clamp(230px,53dvh,490px);border-color:#577a77;box-shadow:0 16px 60px #0005}#coach{border-radius:5px 12px 12px 5px;background:#163b43}.drive button{min-height:64px;font-size:1.1rem}.drive button:first-child{border-color:#78cfca}.drive button:last-child{border-color:#b9e9a0}.tag{color:#efbd70}.meter{display:flex;gap:5px;margin:8px 0}.meter span{height:5px;flex:1;background:#365862;border-radius:8px}.meter span[data-result="true"]{background:#b9e9a0}.meter span[data-result="false"]{background:#efbd70}.meter span.current{outline:1px solid #f4ecd9;outline-offset:2px}.tools{justify-content:space-between}small{line-height:1.5}@media(max-height:520px) and (orientation:landscape){canvas{height:58dvh}.meter{grid-column:2}.drive button{min-height:44px}}
</style>
<main><header><div><div class="tag">Slipwake / lantern regatta · 0.2</div><h1>Mercy Clutch</h1></div><div class="stats" id="stats"></div></header>
<canvas aria-label="Practice loop showing four marked left-turn gates and your craft." role="img"></canvas><div id="coach" role="status" aria-live="polite"></div>
<div class="meter" id="meter" aria-label="Gate results"><span></span><span></span><span></span><span></span></div><div class="drive"><button id="steer" aria-pressed="false">↶ Steer</button><button id="drive" aria-pressed="false">↑ Throttle</button></div>
<div class="tools"><button id="pause">Pause</button><button id="reset">Restart practice</button></div><small>Hold throttle on the straight. Release at amber, steer through teal, throttle again at the exit. <span class="kbd">Keys: W / ↑ and A / ←.</span> Find the rhythm of the lantern gates. Clean transitions carry more speed.</small></main>
<script id="model">
const GATES=[.16,.38,.60,.82];
const VERSION="Mercy Clutch lab 0.2";
const fresh=()=>({p:0,v:0,drift:0,g:0,lap:0,clean:0,results:[],elapsed:0,last:"",ok:[true,true,true],t:0,phase:0,ended:false});
function step(s,input,dt){
 if(s.ended)return s;
 if(s.v>0||input.drive)s.elapsed+=dt;
 const gate=GATES[s.g], lo=gate-.045, mid=gate-.018, exit=gate+.022, hi=gate+.055;
 const phase=s.p<lo?0:s.p<mid?1:s.p<exit?2:s.p<hi?3:4;
 if(phase!==s.phase){s.phase=phase;s.t=0}
 const gap=phase===1?!input.drive:phase===2?input.steer&&!input.drive:phase===3?input.drive&&!input.steer:true;
 if(!gap){s.t+=dt;if(s.t>.11&&phase>=1&&phase<=3)s.ok[phase-1]=false}
 const speed=phase>=1&&phase<=3?(gap?.105:.072):(input.drive?.145:Math.max(0,s.v-.27*dt));
 s.v=phase>=1&&phase<=3?speed:input.drive?Math.min(speed,s.v+.3*dt):speed;
 s.drift+=((phase===2&&!gap?1.4:phase===1&&input.drive?.55:input.steer&&phase!==2?-.7:0)-s.drift)*Math.min(1,5*dt);
 const prev=s.p;
 s.p+=s.v*dt;
 if(s.p>=hi&&prev<hi){
  const pass=s.ok.every(Boolean);if(pass)s.clean++;s.results.push(pass);
  s.last=pass?"Clean gate. Carry that rhythm.":!s.ok[0]?"Next gate: come fully off throttle at amber.":!s.ok[1]?"Next gate: hold steer, with throttle still off.":"Next gate: let go of steer, then add throttle at the exit.";
  s.ok=[true,true,true];s.t=0;s.phase=0;
  if(s.g<3)s.g++;
 }
 if(s.p>=1){s.p=1;s.ended=true;s.lap=1;}
 return s;
}
</script>
<script>
const $=s=>document.querySelector(s),canvas=$('canvas'),ctx=canvas.getContext('2d'),stats=$('#stats'),coach=$('#coach');
let s=fresh(),paused=false,then=0,shown="",ids=new Map(),keys=new Set();
function clear(){ids.clear();keys.clear();}
function action(){return{drive:[...ids.values(),...[...keys].map(x=>({KeyW:'drive',KeyA:'steer',ArrowUp:'drive',ArrowLeft:'steer'}[x]||mapping[x]))].includes('drive'),steer:[...ids.values(),...[...keys].map(x=>({KeyA:"steer",ArrowLeft:"steer"}[x]||mapping[x]))].includes('steer')}}
function setPause(v){paused=v;clear();$('#pause').textContent=v?'Resume':'Pause';}
const mapping={ArrowUp:'drive',w:'drive',W:'drive',ArrowLeft:'steer',a:'steer',A:'steer'};
document.addEventListener('keydown',e=>{if(mapping[e.key]&&(e.target.tagName!=='BUTTON'||e.key.startsWith('Arrow'))){e.preventDefault();if(!paused&&!e.repeat)keys.add(e.code||e.key)}});
document.addEventListener('keyup',e=>keys.delete(e.code||e.key));
for(const id of ['steer','drive']){
 const b=$('#'+id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(!paused){ids.set(e.pointerId,id);b.setPointerCapture(e.pointerId)}});
 for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,e=>ids.delete(e.pointerId));
}
$('#pause').onclick=()=>setPause(!paused);
$('#reset').onclick=()=>{s=fresh();setPause(false);document.body.focus();};
window.addEventListener('blur',()=>setPause(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
function draw(){
 const d=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;
 if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}
 ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
 const point=p=>{const a=Math.PI*2*p-1.570796;return[w/2+Math.cos(a)*w*.365,h/2-Math.sin(a)*h*.34]};
 const line=(a,b,color,width)=>{ctx.beginPath();for(let i=0;i<=100;i++){const [x,y]=point(a+(b-a)*i/100);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()};
 const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#1e4e55');bg.addColorStop(1,'#071f30');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 for(let i=0;i<90;i++){const x=(i*73.37)%w,y=(i*43.71)%h;ctx.strokeStyle='rgba(151,213,205,.10)';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+7,y-2,x+19,y);ctx.stroke()}
 line(0,1,'#09222b',43);line(0,1,'#32616a',36);line(0,1,'#517c80',1);
 for(const [i,g] of GATES.entries()){line(g-.045,g-.018,'#efbd70',9);line(g-.018,g+.022,'#78cfca',9);line(g+.022,g+.055,'#b9e9a0',9);const [x,y]=point(g);ctx.fillStyle=s.results[i]===true?'#b9e9a0':s.results[i]===false?'#efbd70':'#f8ead0';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();}
 const [tx,ty]=point(s.p),a=Math.PI*2*s.p-1.570796,x=tx+Math.cos(a)*15*s.drift,y=ty-Math.sin(a)*15*s.drift;
 if(s.v>.001){for(let i=1;i<20;i++){const [wx,wy]=point(s.p-i*.0018);ctx.fillStyle=`rgba(193,241,227,${.45*(1-i/20)})`;ctx.beginPath();ctx.ellipse(wx,wy,2+i*.35,1+i*.16,0,0,7);ctx.fill()}}
 const [nx,ny]=point(s.p+.001);ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(ny-ty,nx-tx)+s.drift*.35);ctx.shadowColor='#000';ctx.shadowBlur=9;ctx.fillStyle='#f6d9a2';ctx.beginPath();ctx.moveTo(17,0);ctx.quadraticCurveTo(1,-10,-12,-6);ctx.lineTo(-12,6);ctx.quadraticCurveTo(1,10,17,0);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fbf3d9';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,-5);ctx.lineTo(-2,5);ctx.closePath();ctx.fill();ctx.restore();
 ctx.textAlign='center';ctx.fillStyle='#8bceb9';ctx.font='600 10px system-ui';ctx.fillText('L A N T E R N  /  R E G A T T A',w/2,h/2-24);ctx.fillStyle='#f8ead0';ctx.font='26px Georgia';ctx.fillText(s.ended?(s.clean===4?'Perfect passage':'Harbour reached'):'Mercy Clutch',w/2,h/2+7);ctx.font='12px system-ui';ctx.fillStyle='#a8c1bc';ctx.fillText(s.ended?`${s.clean}/4 clean · ${s.elapsed.toFixed(1)}s`:`${Math.round(s.p*100)}% passage · ${s.elapsed.toFixed(1)}s`,w/2,h/2+27);
}
function frame(ms){
 const dt=then?Math.min(.05,(ms-then)/1000):0;then=ms;const a=action();
 if(!paused)step(s,a,dt);
 const labels=[["Build speed","Hold throttle to reach the next amber marker."],["Release","Come completely off throttle."],["Steer","Hold steer while throttle stays off."],["Reapply","Release steer and gently return to throttle."]];
 const label=paused?["Paused","Resume when you’re ready."]:s.ended?["Practice complete",s.clean+" of 4 clean gates. Restart to practice again."]:s.phase===0&&s.last?["Build speed",s.last]:labels[s.phase]||labels[0];
 const key=label.join('|');if(key!==shown){shown=key;coach.replaceChildren(Object.assign(document.createElement('strong'),{textContent:label[0]}),label[1]);}
 const text='GATE '+Math.min(s.g+1,4)+'/4 · CLEAN '+s.clean+'/4';if(stats.textContent!==text)stats.textContent=text;
 for(const id of ['steer','drive'])$('#'+id).setAttribute('aria-pressed',String(a[id]));
 for(const [i,el] of [...$('#meter').children].entries()){el.dataset.result=String(s.results[i]);el.classList.toggle('current',!s.ended&&i===s.g&&! (i<s.results.length));}draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></html>
