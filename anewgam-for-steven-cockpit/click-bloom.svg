<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="62%" cy="44%" r="72%">
      <stop offset="0%" style="stop-color:#221a12" />
      <stop offset="100%" style="stop-color:#0b0a09" />
    </radialGradient>
    <filter id="warmglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- leftover cold structure from before, pushed to the edge and fading -->
  <g opacity="0.22" stroke="#3d6f9e" fill="none" stroke-width="1.2">
    <line x1="40" y1="90" x2="150" y2="170"/>
    <line x1="150" y1="170" x2="95" y2="300"/>
    <line x1="95" y1="300" x2="180" y2="420"/>
    <line x1="150" y1="170" x2="255" y2="245"/>
    <circle cx="40" cy="90" r="4" fill="#3d6f9e" stroke="none"/>
    <circle cx="150" cy="170" r="5" fill="#3d6f9e" stroke="none"/>
    <circle cx="95" cy="300" r="4" fill="#3d6f9e" stroke="none"/>
    <circle cx="180" cy="420" r="3" fill="#3d6f9e" stroke="none"/>
    <circle cx="255" cy="245" r="3" fill="#3d6f9e" stroke="none"/>
  </g>

  <!-- the click: something dropping into a slot it fits exactly -->
  <g transform="translate(500,280)">
    <!-- radiating lines, uneven on purpose -->
    <g stroke="#f0a83c" stroke-width="2" stroke-linecap="round" opacity="0.85" filter="url(#soft)">
      <line x1="0" y1="-58" x2="0" y2="-96"/>
      <line x1="41" y1="-41" x2="72" y2="-72"/>
      <line x1="58" y1="0" x2="104" y2="0"/>
      <line x1="41" y1="41" x2="66" y2="66"/>
      <line x1="-41" y1="-41" x2="-78" y2="-78"/>
      <line x1="-58" y1="4" x2="-92" y2="6"/>
      <line x1="-30" y1="50" x2="-48" y2="82"/>
      <line x1="8" y1="60" x2="14" y2="88"/>
    </g>

    <circle r="46" fill="none" stroke="#c98529" stroke-width="1.4" opacity="0.5"/>
    <circle r="30" fill="#f6c35f" opacity="0.30" filter="url(#warmglow)"/>
    <circle r="13" fill="#ffd98a" filter="url(#warmglow)"/>
  </g>

  <!-- the loose, unserious part: a few things drifting up and off, none of them aligned -->
  <g fill="#e8b45a" opacity="0.75">
    <circle cx="612" cy="168" r="3.5"/>
    <circle cx="668" cy="112" r="2.5"/>
    <circle cx="571" cy="118" r="2"/>
    <circle cx="700" cy="205" r="2.8"/>
    <circle cx="430" cy="128" r="2.2"/>
    <circle cx="738" cy="140" r="1.8"/>
    <circle cx="352" cy="176" r="1.6"/>
  </g>

  <!-- a stem, because of the word -->
  <g stroke="#7aa35c" fill="none" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
    <path d="M500 326 C 498 400, 506 452, 492 520"/>
    <path d="M500 378 C 462 366, 440 384, 430 404 C 462 412, 490 400, 500 378 Z" fill="#7aa35c" opacity="0.55" stroke="none"/>
    <path d="M497 438 C 534 424, 558 442, 568 462 C 536 470, 508 458, 497 438 Z" fill="#688c4e" opacity="0.5" stroke="none"/>
  </g>
</svg>
