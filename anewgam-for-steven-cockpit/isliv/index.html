<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8b892">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>is.liv · anewgam</title>
<style>
:root{--wall:#f4c9a8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--wall);overflow:hidden;overscroll-behavior:none}
body{min-height:100dvh;background:linear-gradient(180deg,#f8ddd1 0%,#f4c9a8 52%,#e8b892 100%);touch-action:none;user-select:none}
.plate{position:fixed;inset:0;display:grid;justify-items:end;align-items:start}
.plate img{display:block;width:100%;height:100%;max-width:100vw;max-height:100dvh;object-fit:contain;object-position:right top;pointer-events:none}
@media (min-width:900px){.plate{align-items:stretch}.plate img{width:auto;height:100%;max-width:min(56vw,720px);object-position:right center}}
</style>
</head>
<body>
<main class="plate">
<img src="isliv-colour-test.jpg" width="720" height="900" alt="is.liv colour test — a softer brighter you" decoding="async" fetchpriority="high" draggable="false">
</main>
<script>try{history.replaceState(null,"","#view=isliv")}catch(e){}</script>
</body>
</html>
