<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1c2838"/>
<title>Saelion · astral matrix v0.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--cobalt:#2a3a52;--deep:#1c2838;--corn:#8fb4e8;--cyan:#7fd0c8;--gold:#F0C75E;--ink:#f4efe6;--wine:#8a3d44}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e1210;color:var(--ink);font:16px/1.45 Outfit,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0}
.ui{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;pointer-events:none}
.top{padding:1.2rem 1.4rem;display:flex;justify-content:space-between}
.k{letter-spacing:.16em;text-transform:uppercase;font-size:.7rem;color:var(--cyan)}
h1{font-family:Fraunces,serif;font-weight:500;font-size:clamp(1.6rem,4vw,2.4rem)}
.sub{opacity:.7;font-size:.9rem}
.rail{pointer-events:auto;display:flex;gap:.5rem;flex-wrap:wrap}
button{font:inherit;background:rgba(28,40,56,.7);color:var(--cyan);border:1px solid rgba(143,180,232,.4);border-radius:999px;padding:.45rem .9rem;cursor:pointer;backdrop-filter:blur(8px)}
button:hover,button.on{border-color:var(--corn);color:var(--ink)}
.doors{pointer-events:auto;margin-top:auto;padding:1rem 1.4rem 1.6rem;display:flex;flex-wrap:wrap;gap:.6rem}
a.door{text-decoration:none;color:var(--ink);background:rgba(14,18,16,.65);border:1px solid rgba(240,199,94,.3);border-radius:12px;padding:.6rem .8rem;backdrop-filter:blur(6px);font-size:.85rem}
a.door:hover{border-color:var(--gold);transform:translateY(-2px)}
a.door strong{display:block;color:var(--gold)}
.hint{position:absolute;left:50%;bottom:5.5rem;transform:translateX(-50%);font-size:.78rem;color:var(--cyan);opacity:.6;text-align:center}
.score{position:absolute;top:5rem;right:1.4rem;font-size:.8rem;color:var(--gold);opacity:.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="top">
    <div>
      <div class="k">saelion · astral matrix · v0.2</div>
      <h1>the field remembers</h1>
      <p class="sub">77 nodes · mouse pulls · red rain optional · real games</p>
    </div>
    <div class="rail">
      <button id="fs">full</button>
      <button id="quiet">quiet</button>
      <button id="rain">red rain</button>
      <button id="attract">attract</button>
    </div>
  </div>
  <div class="score" id="score">nodes touched: 0</div>
  <p class="hint">double-click immersive · click nodes to collect · doors open real games</p>
  <div class="doors">
    <a class="door" href="/well/index.html"><strong>Well</strong>garden</a>
    <a class="door" href="/cobalt/index.html"><strong>Cobalt</strong>study</a>
    <a class="door" href="/story.html"><strong>Story</strong></a>
    <a class="door" href="/peachfall/index.html"><strong>Peachfall</strong>dream</a>
    <a class="door" href="/buy-a-bunny/index.html"><strong>Bunny</strong></a>
    <a class="door" href="/red-reign/index.html"><strong>Red Reign</strong></a>
    <a class="door" href="/goober/index.html"><strong>Crossing</strong></a>
    <a class="door" href="https://saelion.co/"><strong>saelion.co</strong></a>
  </div>
</div>
<script>
const c=document.getElementById('c'), ctx=c.getContext('2d');
let nodes=[], running=true, rain=false, attract=false, mouse={x:-999,y:-999}, touched=0;
function resize(){c.width=innerWidth;c.height=innerHeight} resize(); addEventListener('resize',resize);
function seed(){ nodes=Array.from({length:77},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:0.6+Math.random()*1.8,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,phase:Math.random()*6.28,freq:.008+Math.random()*.02,collected:false})) }
seed();
function tick(){
  if(!running) return;
  ctx.fillStyle='rgba(14,18,16,.16)'; ctx.fillRect(0,0,c.width,c.height);
  if(rain){
    ctx.fillStyle='rgba(138,61,68,.08)';
    for(let i=0;i<40;i++){
      const x=Math.random()*c.width, y=Math.random()*c.height;
      ctx.fillRect(x,y,1,8);
    }
  }
  for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, d=Math.hypot(dx,dy);
    if(d<140){ ctx.beginPath(); ctx.strokeStyle=`rgba(143,180,232,${(1-d/140)*.2})`; ctx.lineWidth=.5; ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke(); }
  }
  nodes.forEach(n=>{
    if(attract && mouse.x>0){
      const dx=mouse.x-n.x, dy=mouse.y-n.y, d=Math.hypot(dx,dy)||1;
      n.vx += dx/d * 0.015; n.vy += dy/d * 0.015;
      n.vx *= .98; n.vy *= .98;
    }
    n.phase += n.freq;
    const a = n.collected ? .2 : .4 + Math.abs(Math.sin(n.phase))*.6;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.28);
    ctx.fillStyle = n.collected ? 'rgba(240,199,94,.4)' : `rgba(143,180,232,${a})`;
    ctx.shadowBlur = n.r*5; ctx.shadowColor = n.collected ? '#F0C75E' : '#8fb4e8'; ctx.fill(); ctx.shadowBlur=0;
    n.x += n.vx; n.y += n.vy;
    if(n.x<0||n.x>c.width) n.vx*=-1; if(n.y<0||n.y>c.height) n.vy*=-1;
  });
  requestAnimationFrame(tick);
}
tick();
addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
addEventListener('touchmove', e=>{ if(e.touches[0]){ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; } }, {passive:true});
c.onclick = e=>{
  const rect=c.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  nodes.forEach(n=>{
    if(!n.collected && Math.hypot(n.x-x,n.y-y)<n.r+8){ n.collected=true; touched++; document.getElementById('score').textContent='nodes touched: '+touched; }
  });
};
document.getElementById('quiet').onclick=()=>{ running=!running; if(running) tick(); };
document.getElementById('rain').onclick=function(){ rain=!rain; this.classList.toggle('on',rain); };
document.getElementById('attract').onclick=function(){ attract=!attract; this.classList.toggle('on',attract); };
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
c.ondblclick=()=>document.getElementById('fs').click();
</script>
</body>
</html>
