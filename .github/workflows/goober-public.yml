name: Verify checked-in Goober

on:
  push:
    branches: [master, test/public-door-acceptance-20261027]
    paths:
      - 'goober/**'
      - 'peachfall/**'
      - '.github/workflows/goober-public.yml'
      - '.github/scripts/publish-goober.py'
      - 'goober-release.json'
  pull_request:
    paths:
      - 'goober/**'
      - 'peachfall/**'
      - '.github/workflows/goober-public.yml'
      - '.github/scripts/publish-goober.py'
      - 'goober-release.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goober-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref != 'refs/heads/test/public-door-acceptance-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify public catalog, routes, story contract, and offline shell
        run: node goober/tests/public-contracts.mjs
      - name: Verify image and input regressions
        run: |
          node --experimental-vm-modules goober/tests/peachfall-signal-run-model.mjs
          node goober/tests/peachfall-signal-run-interruptions.mjs
      - name: Install pinned browser test client without downloading browsers
        run: npm install --prefix "$RUNNER_TEMP/saelion-browser" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
      - name: Verify real Chrome interruptions and image failures
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/saelion-browser/node_modules/playwright-core/index.mjs
          EVIDENCE_DIR: ${{ runner.temp }}/public-game-evidence
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          xvfb-run -a node goober/tests/peachfall-signal-run-browser.mjs
      - name: Verify signed-out public release after master publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/saelion-browser/node_modules/playwright-core/index.mjs
          EVIDENCE_DIR: ${{ runner.temp }}/public-game-live-evidence
          VERIFY_PUBLIC: '1'
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          xvfb-run -a node goober/tests/peachfall-signal-run-browser.mjs
      - name: Preserve public release evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: public-game-live-evidence
          path: ${{ runner.temp }}/public-game-live-evidence/
          if-no-files-found: warn
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-game-browser-evidence
          path: ${{ runner.temp }}/public-game-evidence/
          if-no-files-found: warn

# GitHub Pages publishes the checked-in master branch through its native
# "pages build and deployment" workflow. This verifier never rewrites goober/,
# commits generated files, pushes to master, or installs the historical archive.

  public-door-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/public-door-acceptance-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install existing pinned browser client
        run: npm install --prefix "$RUNNER_TEMP/saelion-browser" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
      - name: Verify exact public Cobalt and Goober entrance with native pageerror
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/saelion-browser/node_modules/playwright-core/index.mjs
          EVIDENCE_DIR: ${{ runner.temp }}/public-door-acceptance
          SOURCE_COMMIT: a6ac2d239863d5c7c1087f52e5e297d059c33cc0
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node goober/tests/public-door-acceptance.mjs
      - name: Preserve exact acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-door-acceptance
          path: ${{ runner.temp }}/public-door-acceptance/
          if-no-files-found: error
