name: Saelion one-home acceptance
on:
  push:
    branches: [master, sae/one-development-home-20260917]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: saelion-one-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Shared unit, regression and static-build checks
        run: npm run check
      - name: Declared shell files and served-byte verifier regression checks
        run: |
          python -B -m unittest discover -s tests -p 'test_verify_unified_home.py' -v
          python -B scripts/verify_unified_home.py --root dist --require-pwa > "$RUNNER_TEMP/unified-home-check.json"
          cat "$RUNNER_TEMP/unified-home-check.json"
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real browser play, ingress, mobile and offline round trip
        shell: bash
        run: |
          node tools/one.mjs dev > "$RUNNER_TEMP/saelion-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4317/ >/dev/null && break; sleep 1; done
          python tests/browser.py
      - name: Package output without changing existing symbolic route names
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/saelion-evidence"
          if [ -d dist ]; then tar -czf "$RUNNER_TEMP/saelion-evidence/site.tar.gz" -C dist .; fi
          if [ -d test-results/browser ]; then cp -r test-results/browser "$RUNNER_TEMP/saelion-evidence/browser"; fi
          if [ -f "$RUNNER_TEMP/unified-home-check.json" ]; then cp "$RUNNER_TEMP/unified-home-check.json" "$RUNNER_TEMP/saelion-evidence/"; fi
          git rev-parse HEAD > "$RUNNER_TEMP/saelion-evidence/source-commit.txt"
      - name: Preserve browser evidence and usable static output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saelion-one-preview-and-evidence
          path: ${{ runner.temp }}/saelion-evidence/
          if-no-files-found: warn
          retention-days: 14
